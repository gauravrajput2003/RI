services:
  - type: web
    name: ri-fleet-admin
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fleet/api typecheck && VITE_API_URL=/api/v1 VITE_SOCKET_URL=/ pnpm --filter @fleet/web build
    startCommand: node --import tsx services/api/src/db/migrate.ts && node --import tsx services/api/src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ri-fleet-postgis
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: ri-fleet-admin
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_TRACKER_SECRET
        generateValue: true

databases:
  - name: ri-fleet-postgis
    region: singapore
    plan: free
    postgresMajorVersion: '16'
